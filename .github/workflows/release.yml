name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        type: choice
        default: full
        options:
          - full
          - alpha

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ -z "${version}" ]; then
            echo "package.json version is empty" >&2
            exit 1
          fi

          if [ "${{ inputs.release_type }}" = "alpha" ]; then
            latest_alpha="$(git tag --list "v${version}-alpha.*" --sort=-v:refname | head -1 || true)"
            if [ -z "${latest_alpha}" ]; then
              alpha_num=1
              previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-alpha' | head -1 || true)"
            else
              alpha_num="$(echo "${latest_alpha}" | sed 's/.*-alpha\.//')"
              alpha_num="$((alpha_num + 1))"
              previous_tag="${latest_alpha}"
            fi
            tag="v${version}-alpha.${alpha_num}"
            prerelease="true"
          else
            previous_tag="$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-alpha' | head -1 || true)"
            tag="v${version}"
            prerelease="false"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "name=${tag}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "previous_tag=${previous_tag:-}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            updater-platform: windows-x86_64
            uv-asset: uv-x86_64-pc-windows-msvc.zip
            uv-binary: uv.exe
            ffmpeg-asset: ffmpeg-windows-x64.zip
            ffmpeg-binary: ffmpeg.exe
          - name: macOS Apple Silicon
            os: macos-latest
            rust-target: aarch64-apple-darwin
            updater-platform: darwin-aarch64
            uv-asset: uv-aarch64-apple-darwin.tar.gz
            uv-binary: uv
            ffmpeg-asset: ffmpeg-osx-arm64.zip
            ffmpeg-binary: ffmpeg
          - name: macOS Intel
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
            updater-platform: darwin-x86_64
            uv-asset: uv-x86_64-apple-darwin.tar.gz
            uv-binary: uv
            ffmpeg-asset: ffmpeg-osx-x64.zip
            ffmpeg-binary: ffmpeg
          - name: Linux x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            updater-platform: linux-x86_64
            uv-asset: uv-x86_64-unknown-linux-gnu.tar.gz
            uv-binary: uv
            ffmpeg-asset: ffmpeg-linux-x64.zip
            ffmpeg-binary: ffmpeg

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp package version into Tauri config
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          node -e "
            const fs = require('node:fs');
            const configPath = 'src-tauri/tauri.conf.json';
            const pubkey = process.env.TAURI_UPDATER_PUBKEY;
            if (!pubkey) {
              throw new Error('TAURI_UPDATER_PUBKEY must be configured as a GitHub variable or secret');
            }
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            config.version = '${{ needs.version.outputs.version }}';
            config.bundle = config.bundle || {};
            config.bundle.createUpdaterArtifacts = true;
            config.plugins = config.plugins || {};
            config.plugins.updater = {
              pubkey,
              endpoints: [
                'https://github.com/${{ github.repository }}/releases/latest/download/latest.json'
              ]
            };
            fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          "

      - name: Bundle latest uv runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $assetName = '${{ matrix.uv-asset }}'
          $assetUrl = "https://github.com/astral-sh/uv/releases/latest/download/$assetName"
          $checksumUrl = "$assetUrl.sha256"
          New-Item -ItemType Directory -Force -Path '.release/uv' | Out-Null
          $archivePath = Join-Path '.release/uv' $assetName
          $checksumPath = "$archivePath.sha256"

          Invoke-WebRequest -Uri $assetUrl -OutFile $archivePath
          Invoke-WebRequest -Uri $checksumUrl -OutFile $checksumPath

          $checksumContent = Get-Content $checksumPath -Raw
          $expectedHash = [regex]::Match($checksumContent, '[a-fA-F0-9]{64}').Value.ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()

          if ($expectedHash -ne $actualHash) {
            throw "uv checksum mismatch for $assetName"
          }

          $extractPath = '.release/uv/extracted'
          New-Item -ItemType Directory -Force -Path $extractPath | Out-Null
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

          $binaryName = '${{ matrix.uv-binary }}'
          $binary = Get-ChildItem -Path $extractPath -Recurse -File |
            Where-Object { $_.Name -eq $binaryName } |
            Select-Object -First 1

          if ($null -eq $binary) {
            throw "Unable to find extracted uv binary: $binaryName"
          }

          $runtimePath = 'src-tauri/resources/runtime/uv'
          New-Item -ItemType Directory -Force -Path $runtimePath | Out-Null
          Copy-Item -Path $binary.FullName -Destination (Join-Path $runtimePath $binaryName) -Force

          & (Join-Path $runtimePath $binaryName) --version

      - name: Bundle latest uv runtime (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          asset_name='${{ matrix.uv-asset }}'
          binary_name='${{ matrix.uv-binary }}'
          asset_url="https://github.com/astral-sh/uv/releases/latest/download/${asset_name}"
          checksum_url="${asset_url}.sha256"
          archive_path=".release/uv/${asset_name}"
          checksum_path="${archive_path}.sha256"
          extract_path=".release/uv/extracted"
          runtime_path="src-tauri/resources/runtime/uv"

          mkdir -p ".release/uv" "${extract_path}" "${runtime_path}"
          curl -fsSL "${asset_url}" -o "${archive_path}"
          curl -fsSL "${checksum_url}" -o "${checksum_path}"

          expected_hash="$(grep -Eo '[a-fA-F0-9]{64}' "${checksum_path}" | head -n 1 | tr 'A-F' 'a-f')"
          if command -v sha256sum >/dev/null 2>&1; then
            actual_hash="$(sha256sum "${archive_path}" | awk '{print $1}')"
          else
            actual_hash="$(shasum -a 256 "${archive_path}" | awk '{print $1}')"
          fi

          if [ "${expected_hash}" != "${actual_hash}" ]; then
            echo "uv checksum mismatch for ${asset_name}" >&2
            exit 1
          fi

          tar -xzf "${archive_path}" -C "${extract_path}"
          binary_path="$(find "${extract_path}" -type f -name "${binary_name}" | head -n 1)"

          if [ -z "${binary_path}" ]; then
            echo "Unable to find extracted uv binary: ${binary_name}" >&2
            exit 1
          fi

          cp "${binary_path}" "${runtime_path}/${binary_name}"
          chmod +x "${runtime_path}/${binary_name}"
          "${runtime_path}/${binary_name}" --version

      - name: Bundle latest FFmpeg runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $assetName = '${{ matrix.ffmpeg-asset }}'
          $binaryName = '${{ matrix.ffmpeg-binary }}'
          $assetUrl = "https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/$assetName"
          $releasePath = '.release/ffmpeg'
          $archivePath = Join-Path $releasePath $assetName
          $extractPath = Join-Path $releasePath 'extracted'
          $runtimePath = Join-Path 'src-tauri/resources/runtime/ffmpeg' '${{ matrix.rust-target }}'

          New-Item -ItemType Directory -Force -Path $releasePath, $extractPath, $runtimePath | Out-Null
          Invoke-WebRequest -Uri $assetUrl -OutFile $archivePath

          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $binary = Get-ChildItem -Path $extractPath -Recurse -File |
            Where-Object { $_.Name -eq $binaryName } |
            Select-Object -First 1

          if ($null -eq $binary) {
            throw "Unable to find extracted FFmpeg binary: $binaryName"
          }

          Copy-Item -Path $binary.FullName -Destination (Join-Path $runtimePath $binaryName) -Force
          & (Join-Path $runtimePath $binaryName) -version

      - name: Bundle latest FFmpeg runtime (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          asset_name='${{ matrix.ffmpeg-asset }}'
          binary_name='${{ matrix.ffmpeg-binary }}'
          asset_url="https://github.com/Tyrrrz/FFmpegBin/releases/latest/download/${asset_name}"
          archive_path=".release/ffmpeg/${asset_name}"
          extract_path=".release/ffmpeg/extracted"
          runtime_path="src-tauri/resources/runtime/ffmpeg/${{ matrix.rust-target }}"

          mkdir -p ".release/ffmpeg" "${extract_path}" "${runtime_path}"
          curl -fsSL "${asset_url}" -o "${archive_path}"

          unzip -q "${archive_path}" -d "${extract_path}"
          binary_path="$(find "${extract_path}" -type f -name "${binary_name}" | head -n 1)"

          if [ -z "${binary_path}" ]; then
            echo "Unable to find extracted FFmpeg binary: ${binary_name}" >&2
            exit 1
          fi

          cp "${binary_path}" "${runtime_path}/${binary_name}"
          chmod +x "${runtime_path}/${binary_name}"
          "${runtime_path}/${binary_name}" -version

      - name: Build Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.rust-target }}

      - name: Write updater manifest
        shell: bash
        env:
          UPDATER_PLATFORM: ${{ matrix.updater-platform }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const platform = process.env.UPDATER_PLATFORM;
          const target = process.env.RUST_TARGET;
          const bundleRoot = path.join('src-tauri', 'target', target, 'release', 'bundle');
          const walk = (directory) => {
            if (!fs.existsSync(directory)) {
              return [];
            }
            const files = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const entryPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                files.push(...walk(entryPath));
              } else {
                files.push(entryPath);
              }
            }
            return files;
          };
          const files = walk(bundleRoot).filter((filePath) => !filePath.endsWith('.sig'));
          const byPreference = (candidates) => {
            const artifact = candidates.find((filePath) => fs.existsSync(`${filePath}.sig`));
            if (!artifact) {
              throw new Error(`No signed updater artifact found for ${platform}`);
            }
            return artifact;
          };
          const artifact = platform.startsWith('darwin-')
            ? byPreference(files.filter((filePath) => filePath.endsWith('.app.tar.gz')))
            : platform === 'linux-x86_64'
              ? byPreference(files.filter((filePath) => filePath.endsWith('.AppImage')))
              : byPreference([
                  ...files.filter((filePath) => filePath.endsWith('.msi')),
                  ...files.filter((filePath) => filePath.endsWith('.exe')),
                ]);
          const manifest = {
            platform,
            assetName: path.basename(artifact),
            signature: fs.readFileSync(`${artifact}.sig`, 'utf8').trim(),
          };
          fs.writeFileSync(`updater-${platform}.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: actavoces-${{ needs.version.outputs.tag }}-${{ matrix.rust-target }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
            updater-${{ matrix.updater-platform }}.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - version
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundle artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Create updater latest.json
        run: node .github/scripts/create-updater-latest.js release-assets ${{ needs.version.outputs.tag }} ${{ needs.version.outputs.version }}

      - name: Remove temporary updater manifests
        run: find release-assets -type f -name 'updater-*.json' -delete

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          previous_tag: ${{ needs.version.outputs.previous_tag }}
          files: release-assets/**/*
