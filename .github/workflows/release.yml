name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        type: choice
        default: full
        options:
          - full
          - alpha

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      name: ${{ steps.release.outputs.name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: release
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: bash .github/scripts/compute-release-metadata.sh

  build:
    name: Build ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            updater-platform: windows-x86_64
            uv-asset: uv-x86_64-pc-windows-msvc.zip
            uv-binary: uv.exe
            ffmpeg-asset: ffmpeg-windows-x64.zip
            ffmpeg-binary: ffmpeg.exe
          - name: macOS Apple Silicon
            os: macos-latest
            rust-target: aarch64-apple-darwin
            updater-platform: darwin-aarch64
            uv-asset: uv-aarch64-apple-darwin.tar.gz
            uv-binary: uv
            ffmpeg-asset: ffmpeg-osx-arm64.zip
            ffmpeg-binary: ffmpeg
          - name: macOS Intel
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
            updater-platform: darwin-x86_64
            uv-asset: uv-x86_64-apple-darwin.tar.gz
            uv-binary: uv
            ffmpeg-asset: ffmpeg-osx-x64.zip
            ffmpeg-binary: ffmpeg
          - name: Linux x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            updater-platform: linux-x86_64
            uv-asset: uv-x86_64-unknown-linux-gnu.tar.gz
            uv-binary: uv
            ffmpeg-asset: ffmpeg-linux-x64.zip
            ffmpeg-binary: ffmpeg

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Stamp package version into Tauri config
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY || secrets.TAURI_UPDATER_PUBKEY }}
        run: node .github/scripts/stamp-tauri-config.js

      - name: Bundle latest uv runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UV_ASSET: ${{ matrix.uv-asset }}
          UV_BINARY: ${{ matrix.uv-binary }}
        run: ./.github/scripts/bundle-uv.ps1

      - name: Bundle latest uv runtime (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          UV_ASSET: ${{ matrix.uv-asset }}
          UV_BINARY: ${{ matrix.uv-binary }}
        run: bash .github/scripts/bundle-uv.sh

      - name: Bundle latest FFmpeg runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FFMPEG_ASSET: ${{ matrix.ffmpeg-asset }}
          FFMPEG_BINARY: ${{ matrix.ffmpeg-binary }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: ./.github/scripts/bundle-ffmpeg.ps1

      - name: Bundle latest FFmpeg runtime (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          FFMPEG_ASSET: ${{ matrix.ffmpeg-asset }}
          FFMPEG_BINARY: ${{ matrix.ffmpeg-binary }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: bash .github/scripts/bundle-ffmpeg.sh

      - name: Build Tauri bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.rust-target }}

      - name: Write updater manifest
        env:
          UPDATER_PLATFORM: ${{ matrix.updater-platform }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: node .github/scripts/write-updater-manifest.js

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: actavoces-${{ needs.version.outputs.tag }}-${{ matrix.rust-target }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
            updater-${{ matrix.updater-platform }}.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - version
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download bundle artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Create updater latest.json
        run: node .github/scripts/create-updater-latest.js release-assets ${{ needs.version.outputs.tag }} ${{ needs.version.outputs.version }}

      - name: Remove temporary updater manifests
        run: find release-assets -type f -name 'updater-*.json' -delete

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.version.outputs.name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          previous_tag: ${{ needs.version.outputs.previous_tag }}
          files: release-assets/**/*
