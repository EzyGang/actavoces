[package]
name = "actavoces"
version = "0.1.0"
description = "Local-first meeting recorder and transcript workspace."
authors = ["galtozzy <galtozzy+git@gmail.com>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Galtozzy/actavoces"
homepage = "https://github.com/Galtozzy/actavoces"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "actavoces_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
cpal = "0.18.1"
hound = "3.5.1"
keyring = "4.0.1"
keyring-core = "1.0.0"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["load-dynamic", "std", "api-24"] }
parakeet-rs = { version = "0.3.2", default-features = false, features = ["load-dynamic", "sortformer"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }


[target.'cfg(windows)'.dependencies]
windows-core = "=0.61.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
