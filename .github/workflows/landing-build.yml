name: Landing Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Landing Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build & Push Landing Image
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME_LANDING }}
        run: |
          image_tag=${GITHUB_SHA::7}
          image_ref="$DOCKER_REGISTRY/$IMAGE_NAME"

          echo "$DOCKER_PASSWORD" | docker login --username "$DOCKER_USERNAME" --password-stdin "$DOCKER_REGISTRY"

          if docker manifest inspect "$image_ref:$image_tag" > /dev/null 2>&1
          then
            docker buildx imagetools create \
              --tag "$image_ref:latest" \
              "$image_ref:$image_tag"
          else
            docker buildx build --push --file docker/Dockerfile \
              --tag "$image_ref:$image_tag" \
              --tag "$image_ref:latest" \
              --cache-to "type=registry,ref=$image_ref:deps,compression=zstd" \
              --cache-from "type=registry,ref=$image_ref:deps" \
              .
          fi
